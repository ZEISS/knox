# .github/workflows/release.yml

name: Release

on:
  push:
    tags:
      - "v*"

env:
  DOCKER_IMAGE_REPO: ghcr.io/zeiss/knox

jobs:
  test:
    permissions:
      checks: write
    uses: ./.github/workflows/main.yml

  release:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          go tool github.com/zeiss/pkg/cmd/helm/update --file helm/Chart.yaml --version ${{ github.ref_name }}
          go tool github.com/zeiss/pkg/cmd/helm/package --package-path tmp --path helm
          go tool github.com/zeiss/pkg/cmd/helm/release --package-path tmp --repo ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
