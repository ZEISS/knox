version: "2"
run:
  build-tags:
    - tests

linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dupl
    - durationcheck
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - goconst
    - gocritic
    - godot
    - gomoddirectives
    - gosec
    - importas
    - makezero
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - promlinter
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tagliatelle
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting
    - wastedassign
    - whitespace

  disable:
    - tagliatelle
    - revive
    - mnd
    - gomoddirectives
    - errcheck
    - goconst
    - dupl

  settings:
    exhaustive:
      default-signifies-exhaustive: true

    gomoddirectives:
      replace-allow-list:
        - github.com/goccy/go-yaml

    gosec:
      excludes:
        - G115 # integer overflow conversion
        - G306 # poor file permissions

    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true

    nolintlint:
      allow-unused: true # false would be preferable, but it's flaky (https://github.com/golangci/golangci-lint/issues/3228)
      require-specific: true

    tagliatelle:
      case:
        rules:
          bson: goSnake
          json: goSnake
          xml: goCamel
          yaml: goCamel

  exclusions:
    generated: lax

    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      - linters:
          - dupl
          - forcetypeassert
          - goconst
          - govet
          - mnd
        path: _test\.go

    paths:
      - ^api/*
      - ^deploy/*
      - ^docs/*
      - ^hack/*
      - ^internal/test/mocks/*
      - third_party$
      - builtin$
      - examples$

issues:
  max-same-issues: 30

formatters:
  enable:
    - gofumpt
    - goimports

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/cerbos/cerbos)
        - blank
        - dot
      custom-order: true

    gofumpt:
      # Extra formatting rules.
      extra:
        # Groups function parameters with repeated types.
        # Default: false
        group-params: true
        # Clothes naked returns in functions with named results.
        # Default: false
        clothe-returns: true
        # Multi-line function calls with the opening parenthesis at the end of a line should place the closing parenthesis at the start of a line.
        # Default: false
        balance-calls: true

  exclusions:
    generated: lax

    paths:
      - ^api/*
      - ^deploy/*
      - ^docs/*
      - ^hack/*
      - ^internal/test/mocks/*
      - third_party$
      - builtin$
      - examples$
